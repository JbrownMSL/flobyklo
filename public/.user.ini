; #2948 — receipt photos are taken on a phone, and vader's global limit is
; upload_max_filesize=2M / post_max_size=8M, which silently DISCARDS a normal
; iPhone photo before PHP hands it to the app. Raised here rather than in
; /etc/php-fpm.d/www.conf because that pool is shared with every other PHP app
; on vader; this file scopes the change to this docroot. PHP re-reads it every
; 300s (user_ini.cache_ttl), so a change is not instant.
upload_max_filesize = 12M
post_max_size = 16M
